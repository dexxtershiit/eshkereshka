<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Исторические места Беларуси</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <strong>Исторические</strong> <mark>места Беларуси</mark>
      </a>
      <nav class="nav-actions">
        <a href="login.html" class="btn btn-outline">Вход</a>
        <a href="register.html" class="btn btn-primary">Регистрация</a>
      </nav>
    </div>
  </header>
  <script>updateHeader();</script>

  <main>
    <section class="hero">
      <h1>Исторические места Беларуси</h1>
      <p>Замки, храмы, парки и древние города — достопримечательности, которые стоит посетить.</p>
    </section>

    <!-- Фильтры по области и району -->
    <section class="filters">
      <div class="filters-inner">
        <label for="filter-region">Область:</label>
        <select id="filter-region">
          <option value="">Все области</option>
        </select>
        <label for="filter-district">Район:</label>
        <select id="filter-district" disabled>
          <option value="">— Район —</option>
        </select>
      </div>
    </section>

    <section class="places" aria-label="Список исторических мест">
      <div id="places-grid" class="places-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>&copy; 2026 Исторические места Беларуси. Все права защищены. Учебный макет.</p>
    </div>
  </footer>
</body>
</html>

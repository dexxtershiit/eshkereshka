<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Исторические места Беларуси</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <strong>Исторические</strong> <mark>места Беларуси</mark>
      </a>
      <nav class="nav-actions">
        <a href="login.html" class="btn btn-primary">Вход</a>
        <a href="register.html" class="btn btn-outline">Регистрация</a>
      </nav>
    </div>
  </header>
  <script>updateHeader();</script>

  <main class="page">
    <div class="auth-card">
      <h2>Вход</h2>
      <p class="intro">Войдите в личный кабинет, чтобы управлять своими маршрутами.</p>

      <div id="login-error" class="form-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="example@mail.by" required>
        </div>
        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-block">Войти</button>
      </form>

      <div class="auth-divider">или</div>

      <p class="auth-link">Ещё нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>&copy; 2026 Исторические места Беларуси. Все права защищены.</p>
    </div>
  </footer>
</body>
</html>
